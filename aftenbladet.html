<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<title>Aftenbladet Infoskjerm</title>

<style>

body {
    margin: 0;
    background: #ffffff;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

.header {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 10px 0 5px 0;
    background: white;
}

.logo {
    height: 70px;
    width: auto;
    display: block;
}


.header img {
    height: 50px;
}

.clock {
    position: fixed;
    top: 20px;
    right: 50px;
    font-size: 32px;
    font-weight: bold;
    color: #333333;
    z-index: 1000;
}

.slide {
    position: absolute;
    top: 0;
    left: 0;

    width: 100vw;
    height: 100vh;

    padding: 90px 50px 80px 50px;
    box-sizing: border-box;

    opacity: 0;
    visibility: hidden;

    transition:
        opacity 1.5s ease-in-out,
        visibility 1.5s ease-in-out;
}

.active {
    opacity: 1;
    visibility: visible;
}

.card {
    display: flex;
    flex-direction: column;
    height: 100%;
}

.top-section {
    display: flex;
    gap: 40px;
}

.image-container {
    width: 42%;
    display: flex;
    justify-content: center;
    align-items: center;
}

.image {
    width: 100%;
    max-height: 45vh;
    object-fit: contain;
    border-radius: 12px;
    background: #ffffff;
}

.text-container {
    width: 58%;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.title {
    font-size: 48px;
    font-weight: bold;
    color: #000000;
    line-height: 1.15;
}

.pubdate {
    margin-top: 15px;
    font-size: 22px;
    color: #666666;
}

.desc {
    margin-top: 35px;
    font-size: 31px;
    color: #333333;
    line-height: 1.6;
}

.status {
    position: fixed;
    bottom: 20px;
    right: 20px;
    font-size: 16px;
    color: 333333;
    background: rgba(0,0,0,0.65);
    padding: 8px 12px;
    border-radius: 8px;
    z-index: 1000;
}

.progress-container {
    position: fixed;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 6px;
    background: rgba(255,255,255,0.15);
}

.progress-bar {
    height: 100%;
    width: 100%;
    background: #808080;
    transition: width 1s linear;
}

</style>
</head>

<body>

<div class="header">
    <img src="Stavanger-Aftenblad.png" alt="Aftenbladet">
</div>

<div id="clock" class="clock"></div>

<div id="slides"></div>

<div id="status" class="status"></div>

<div class="progress-container">
    <div id="progressBar" class="progress-bar"></div>
</div>

<script>

let currentSlide = 0;
let slides = [];

function updateClock() {

    document.getElementById("clock").innerText =
        new Date().toLocaleTimeString(
            "no-NO",
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );
}

updateClock();
setInterval(updateClock, 1000);

async function loadRSS() {

    const url =
      "https://aftenbladet-rss.david-tunsberg-petterson.workers.dev/";

    const response = await fetch(url);
    const text = await response.text();

    const parser = new DOMParser();
    const xml = parser.parseFromString(text, "text/xml");

    const items = xml.getElementsByTagName("item");

    const container =
        document.getElementById("slides");

    let newsCount = 0;

    for (let i = 0; i < items.length; i++) {

        const item = items[i];

        const title =
            item.getElementsByTagName("title")[0]?.textContent || "";

        const upperTitle =
            title.toUpperCase();

        if (
            upperTitle.startsWith("DEBATT:") ||
            upperTitle.startsWith("KOMMENTAR:") ||
            upperTitle.startsWith("LESERBREV:") ||
            upperTitle.startsWith("MENINGER:")
        ) {
            continue;
        }

        if (
            upperTitle.includes("SE ALLE BILDENE") ||
            upperTitle.includes("SJEKK BILDER")
        ) {
            continue;
        }

        let desc =
            item.getElementsByTagName("description")[0]?.textContent || "";

        if (desc.length < 30) {
            continue;
        }

        const pubDate =
            item.getElementsByTagName("pubDate")[0]?.textContent || "";

        let formattedDate = "";

        if (pubDate) {

            formattedDate =
                new Date(pubDate).toLocaleString(
                    "no-NO",
                    {
                        day: "2-digit",
                        month: "2-digit",
                        year: "numeric",
                        hour: "2-digit",
                        minute: "2-digit"
                    }
                );
        }

        let image = "";

        const enclosure =
            item.getElementsByTagName("enclosure")[0];

        if (enclosure) {
            image =
                enclosure.getAttribute("url");
        }

        const slide =
            document.createElement("div");

        slide.classList.add("slide");

        if (newsCount === 0) {
            slide.classList.add("active");
        }

        slide.innerHTML = `
            <div class="card">

                <div class="top-section">

                    <div class="image-container">

                        ${image
                            ? `<img class="image" src="${image}">`
                            : ""}

                    </div>

                    <div class="text-container">

                        <div class="title">
                            ${title}
                        </div>

                        <div class="pubdate">
                            Publisert ${formattedDate}
                        </div>

                    </div>

                </div>

                <div class="desc">
                    ${desc}
                </div>

            </div>
        `;

        container.appendChild(slide);

        newsCount++;

        if (newsCount >= 6) {
            break;
        }
    }

    slides = document.querySelectorAll(".slide");

    if (!slides.length) return;

    const slideDuration = 20000;

    let remaining =
        slideDuration / 1000;

    const progressBar =
        document.getElementById("progressBar");

    const status =
        document.getElementById("status");

    function updateStatus() {

        status.innerText =
            `Nyhetsside ${currentSlide + 1}/${slides.length} • Neste side om ${remaining} sek`;

        const percent =
            (remaining / (slideDuration / 1000))
            * 100;

        progressBar.style.width =
            percent + "%";
    }

    updateStatus();

    setInterval(() => {

        remaining--;

        if (remaining < 0) {

            slides[currentSlide]
                .classList.remove("active");

            currentSlide =
                (currentSlide + 1)
                % slides.length;

            slides[currentSlide]
                .classList.add("active");

            remaining =
                slideDuration / 1000;

            progressBar.style.width =
                "100%";
        }

        updateStatus();

    }, 1000);
}

loadRSS();

</script>

</body>
</html>
