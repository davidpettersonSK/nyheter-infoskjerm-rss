<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<title>Aftenbladet Infoskjerm</title>

<style>

:root {
    --aftenbladet-red: #d61f2a;
    --aftenbladet-black: #101010;
    --aftenbladet-gray-900: #1b1b1b;
    --aftenbladet-gray-700: #4d4d4d;
    --aftenbladet-gray-500: #707070;
    --aftenbladet-gray-200: #ececec;
    --aftenbladet-paper: #f6f3ee;
}

body {
    margin: 0;
    background: linear-gradient(180deg, #f9f9f8 0%, #f2f1ef 100%);
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

.header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 100px;
    padding: 16px 55px 10px 55px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 1000;
    box-sizing: border-box;
    background: rgba(255,255,255,0.95);
    border-bottom: 4px solid var(--aftenbladet-red);
    box-shadow: 0 2px 0 rgba(0,0,0,0.04);
}

.logo {
    display: block;
    height: 120px;
    width: auto;
    object-fit: contain;
    filter: drop-shadow(0 1px 0 rgba(0,0,0,0.08));
}

.clock {
    font-size: 42px;
    font-weight: 700;
    color: var(--aftenbladet-black);
    line-height: 1;
    letter-spacing: 0.02em;
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 140px;
}

.slide {
    position: absolute;
    top: 0;
    left: 0;

    width: 100vw;
    height: 100vh;

    padding: 120px 50px 80px 50px;
    box-sizing: border-box;

    opacity: 0;
    visibility: hidden;

    transition:
        opacity 1.5s ease-in-out,
        visibility 1.5s ease-in-out;
}

.active {
    opacity: 1;
    visibility: visible;
}

.card {
    display: flex;
    flex-direction: column;
    height: 100%;
    padding-top: 10px;
}

.top-section {
    display: flex;
    gap: 34px;
    align-items: flex-start;
}

.image-container {
    width: 38%;
    display: flex;
    justify-content: center;
    align-items: center;
}

.image {
    width: 100%;
    max-height: 46vh;
    object-fit: cover;
    border-radius: 12px;
    background: #ffffff;
    border: 1px solid rgba(0,0,0,0.08);
    box-shadow: 0 10px 22px rgba(0,0,0,0.06);
}

.text-container {
    width: 62%;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
}

.title {
    font-size: 52px;
    font-weight: 800;
    color: var(--aftenbladet-black);
    line-height: 1.08;
    letter-spacing: -0.03em;
}

.pubdate {
    margin-top: 16px;
    font-size: 21px;
    color: var(--aftenbladet-gray-700);
    font-weight: 600;
    letter-spacing: 0.01em;
}

.desc {
    margin-top: 26px;
    font-size: 31px;
    color: var(--aftenbladet-gray-900);
    line-height: 1.42;
    letter-spacing: -0.02em;
    max-width: 92%;
    display: block;
    font-weight: 500;
}

.status {
    position: fixed;
    bottom: 20px;
    right: 20px;
    font-size: 16px;
    color: #ffffff;
    background: rgba(0,0,0,0.72);
    padding: 8px 12px;
    border-radius: 8px;
    z-index: 1000;
}

.progress-container {
    position: fixed;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 6px;
    background: rgba(0,0,0,0.06);
}

.progress-bar {
    height: 100%;
    width: 100%;
    background: var(--aftenbladet-red);
    transition: width 1s linear;
}

</style>
</head>

<body>

<div class="header">
    <img src="Stavanger-Aftenblad.png" alt="Aftenbladet" class="logo">
    <div id="clock" class="clock"></div>
</div>

<div id="slides"></div>

<div id="status" class="status"></div>

<div class="progress-container">
    <div id="progressBar" class="progress-bar"></div>
</div>

<script>

let currentSlide = 0;
let slides = [];

function updateClock() {

    document.getElementById("clock").innerText =
        new Date().toLocaleTimeString(
            "no-NO",
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );
}

updateClock();
setInterval(updateClock, 1000);

function cleanText(value) {
    return (value || "")
        .replace(/<br\s*\/?\s*>/gi, " ")
        .replace(/<[^>]+>/g, " ")
        .replace(/&nbsp;/gi, " ")
        .replace(/&amp;/gi, "&")
        .replace(/\s+/g, " ")
        .trim();
}

async function loadRSS() {

    const url =
      "https://aftenbladet-rss.david-tunsberg-petterson.workers.dev/";

    const response = await fetch(url);
    const text = await response.text();

    const parser = new DOMParser();
    const xml = parser.parseFromString(text, "text/xml");

    const items = xml.getElementsByTagName("item");

    const container =
        document.getElementById("slides");

    let newsCount = 0;

    for (let i = 0; i < items.length; i++) {

        const item = items[i];

        const title =
            item.getElementsByTagName("title")[0]?.textContent || "";

        const upperTitle =
            title.toUpperCase();

        if (
            upperTitle.startsWith("DEBATT:") ||
            upperTitle.startsWith("KOMMENTAR:") ||
            upperTitle.startsWith("LESERBREV:") ||
            upperTitle.startsWith("MENINGER:")
        ) {
            continue;
        }

        if (
            upperTitle.includes("SE ALLE BILDENE") ||
            upperTitle.includes("SJEKK BILDER")
        ) {
            continue;
        }

        let rawDesc =
            item.getElementsByTagName("description")[0]?.textContent || "";

        if (rawDesc) {
            rawDesc = cleanText(rawDesc);
        }

        if (rawDesc.length < 30) {
            continue;
        }

        const pubDate =
            item.getElementsByTagName("pubDate")[0]?.textContent || "";

        let formattedDate = "";

        if (pubDate) {

            formattedDate =
                new Date(pubDate).toLocaleString(
                    "no-NO",
                    {
                        day: "2-digit",
                        month: "2-digit",
                        year: "numeric",
                        hour: "2-digit",
                        minute: "2-digit"
                    }
                );
        }

        let image = "";

        const enclosure =
            item.getElementsByTagName("enclosure")[0];

        if (enclosure) {
            image =
                enclosure.getAttribute("url");
        }

        const slide =
            document.createElement("div");

        slide.classList.add("slide");

        if (newsCount === 0) {
            slide.classList.add("active");
        }

        slide.innerHTML = `
            <div class="card">

                <div class="top-section">

                    <div class="image-container">

                        ${image
                            ? `<img class="image" src="${image}">`
                            : ""}

                    </div>

                    <div class="text-container">

                        <div class="title">
                            ${title}
                        </div>

                        <div class="pubdate">
                            Publisert ${formattedDate}
                        </div>

                    </div>

                </div>

                <div class="desc">
                    ${rawDesc}
                </div>

            </div>
        `;

        container.appendChild(slide);

        newsCount++;

        if (newsCount >= 6) {
            break;
        }
    }

    slides = document.querySelectorAll(".slide");

    if (!slides.length) return;

    const slideDuration = 20000;

    let remaining =
        slideDuration / 1000;

    const progressBar =
        document.getElementById("progressBar");

    const status =
        document.getElementById("status");

    function updateStatus() {

        status.innerText =
            `Nyhetsside ${currentSlide + 1}/${slides.length} • Neste side om ${remaining} sek`;

        const percent =
            (remaining / (slideDuration / 1000))
            * 100;

        progressBar.style.width =
            percent + "%";
    }

    updateStatus();

    setInterval(() => {

        remaining--;

        if (remaining < 0) {

            slides[currentSlide]
                .classList.remove("active");

            currentSlide =
                (currentSlide + 1)
                % slides.length;

            slides[currentSlide]
                .classList.add("active");

            remaining =
                slideDuration / 1000;

            progressBar.style.width =
                "100%";
        }

        updateStatus();

    }, 1000);
}

loadRSS();

</script>

</body>
</html>
