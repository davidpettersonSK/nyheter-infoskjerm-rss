<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<title>NRK Nyheter</title>

<style>
body {
  margin: 0;
  background: black;
  color: white;
  font-family: Arial;
}

.slide {
  display: none;
  height: 100vh;
  width: 100vw;
  position: relative;
}

.active {
  display: block;
}

.image {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0.5;
}

.content {
  position: absolute;
  bottom: 60px;
  left: 60px;
  right: 60px;
}

.title {
  font-size: 50px;
}

.desc {
  font-size: 26px;
  margin-top: 15px;
}
</style>

</head>
<body>

<div id="slides"></div>

<script>

let currentSlide = 0;
let slides = [];

async function loadRSS() {

  const url = 'https://spring-dew-1b91.david-tunsberg-petterson.workers.dev/';

  const response = await fetch(url);
  const text = await response.text();

  const parser = new DOMParser();
  const xml = parser.parseFromString(text, "text/xml");

  const items = xml.getElementsByTagName("item");

  const container = document.getElementById("slides");

let groups = [];

for (let i = 0; i < items.length; i += 2) {

  let html = '<div class="slide">';

  for (let j = i; j < i + 2 && j < items.length; j++) {

    const item = items[j];

    const title = item.getElementsByTagName("title")[0].textContent;
    const desc = item.getElementsByTagName("description")[0].textContent;

    let image = "";
    const media = item.getElementsByTagName("media:content")[0];
    if (media) {
      image = media.getAttribute("url");
    }

    html += `
      <div style="margin-bottom:40px;">
        ${image ? '<img src="' + image + '" style="width:100%; height:300px; object-fit:cover;">' : ''}
        <div style="font-size:36px; margin-top:10px;">${title}</div>
        <div style="font-size:22px;">${desc}</div>
      </div>
    `;
  }

  html += '</div>';

  groups.push(html);
}

const container = document.getElementById("slides");

groups.forEach((group, index) => {
  const div = document.createElement("div");
  div.innerHTML = group;
  const slide = div.firstChild;

  if (index === 0) slide.classList.add("active");

  container.appendChild(slide);
});

slides = document.querySelectorAll(".slide");

setInterval(() => {
  slides[currentSlide].classList.remove("active");
  currentSlide = (currentSlide + 1) % slides.length;
  slides[currentSlide].classList.add("active");
}, 10000);

    const item = items[i];

    const title = item.getElementsByTagName("title")[0].textContent;
    const desc = item.getElementsByTagName("description")[0].textContent;

    let image = "";

    const media = item.getElementsByTagName("media:content")[0];
    if (media) {
      image = media.getAttribute("url");
    }

    const div = document.createElement("div");
    div.classList.add("slide");

    if (i === 0) div.classList.add("active");

    div.innerHTML =
      (image ? '<img class="image" src="' + image + '">' : '') +
      '<div class="content">' +
      '<div class="title">' + title + '</div>' +
      '<div class="desc">' + desc + '</div>' +
      '</div>';

    container.appendChild(div);
  }

  slides = document.querySelectorAll(".slide");

  setInterval(() => {
    slides[currentSlide].classList.remove("active");
    currentSlide = (currentSlide + 1) % slides.length;
    slides[currentSlide].classList.add("active");
  }, 8000);
}

loadRSS();

</script>

</body>
</html>
