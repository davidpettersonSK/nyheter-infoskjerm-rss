<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<title>NRK Infoskjerm</title>

<style>
body {
  margin: 0;
  background: black;
  color: white;
  font-family: Arial, sans-serif;
}

.slide {
  display: none;
  height: 100vh;
  width: 100vw;
  padding: 60px;
  box-sizing: border-box;
}

.active {
  display: block;
}

.container {
  display: flex;
  gap: 40px;
  height: 100%;
}

.card {
  flex: 1;
  display: flex;
  flex-direction: column;
}

.image {
  width: 100%;
  height: 50%;
  object-fit: cover;
  margin-bottom: 20px;
}

.title {
  font-size: 36px;
  font-weight: bold;
}

.desc {
  font-size: 22px;
  margin-top: 10px;
}
</style>

</head>
<body>

<div id="slides"></div>

<script>

let currentSlide = 0;
let slides = [];

async function loadRSS() {

  const url = 'https://spring-dew-1b91.david-tunsberg-petterson.workers.dev/';

  const response = await fetch(url);
  const text = await response.text();

  const parser = new DOMParser();
  const xml = parser.parseFromString(text, "text/xml");

  const items = xml.getElementsByTagName("item");
  const container = document.getElementById("slides");

  for (let i = 0; i < items.length; i += 2) {

    const slide = document.createElement("div");
    slide.classList.add("slide");

    if (i === 0) slide.classList.add("active");

    const wrapper = document.createElement("div");
    wrapper.classList.add("container");

    for (let j = i; j < i + 2 && j < items.length; j++) {

      const item = items[j];

      const title = item.getElementsByTagName("title")[0].textContent;
      const desc = item.getElementsByTagName("description")[0].textContent;

      let image = "";
      const media = item.getElementsByTagName("media:content")[0];
      if (media) {
        image = media.getAttribute("url");
      }

      const card = document.createElement("div");
      card.classList.add("card");

      card.innerHTML =
        (image ? '<img class="image" src="' + image + '">' : '') +
        '<div class="title">' + title + '</div>' +
        '<div class="desc">' + desc + '</div>';

      wrapper.appendChild(card);
    }

    slide.appendChild(wrapper);
    container.appendChild(slide);
  }

  slides = document.querySelectorAll(".slide");

  setInterval(() => {
    slides[currentSlide].classList.remove("active");
    currentSlide = (currentSlide + 1) % slides.length;
    slides[currentSlide].classList.add("active");
  }, 10000);

}

loadRSS();

</script>

</body>
</html>
